<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园导航系统 — 图可视化</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      background: #0a0e27;
      color: #e2e8f0;
      display: flex;
      height: 100vh;
      overflow: hidden
    }

    #sidebar {
      width: 320px;
      background: #0f172a;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      border-right: 2px solid #1e293b;
      flex-shrink: 0
    }

    #canvas-wrap {
      flex: 1;
      position: relative;
      background: #0f172a;
      overflow: hidden;
      cursor: grab
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%
    }

    #tooltip {
      position: absolute;
      pointer-events: none;
      display: none;
      z-index: 4;
      background: rgba(15, 23, 42, .96);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, .2);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .4);
      max-width: 240px
    }

    h2 {
      color: #f87171;
      font-size: 18px;
      border-bottom: 2px solid #f87171;
      padding-bottom: 8px
    }

    .section {
      background: #1e293b;
      border-radius: 8px;
      padding: 14px
    }

    .section h3 {
      font-size: 14px;
      color: #fbbf24;
      margin-bottom: 10px
    }

    .btn {
      display: inline-block;
      padding: 6px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: .2s
    }

    .btn-primary {
      background: #f87171;
      color: #fff
    }

    .btn-primary:hover {
      background: #fca5a5
    }

    .btn-accent {
      background: #38bdf8;
      color: #0f172a
    }

    .btn-accent:hover {
      background: #7dd3fc
    }

    .btn-warn {
      background: #fbbf24;
      color: #0f172a
    }

    .btn-warn:hover {
      background: #fcd34d
    }

    .btn-sm {
      padding: 3px 10px;
      font-size: 11px
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    select,
    input[type=file] {
      padding: 5px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 12px;
      width: 100%
    }

    label {
      font-size: 12px;
      color: #94a3b8;
      display: block;
      margin-bottom: 2px
    }

    .info-line {
      font-size: 12px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between
    }

    .info-line span {
      color: #e2e8f0
    }

    #result-box {
      font-size: 11px;
      background: #020617;
      border-radius: 4px;
      padding: 10px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      white-space: pre-wrap;
      color: #4ade80;
      line-height: 1.5
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%
    }

    .file-hint {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px
    }

    .ring-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px
    }

    .ring-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px dashed rgba(148, 163, 184, .3);
      background: transparent
    }
  </style>
</head>

<body>

  <div id="sidebar">
    <h2>校园导航系统</h2>

    <div class="section">
      <h3>加载数据</h3>
      <label>地点文件 (places.csv)</label>
      <input type="file" id="file-places" accept=".csv" onchange="checkFiles()">
      <label style="margin-top:6px">道路文件 (roads.csv)</label>
      <input type="file" id="file-roads" accept=".csv" onchange="checkFiles()">
      <button class="btn btn-primary btn-sm" style="margin-top:6px;width:100%" onclick="loadFiles()" id="btn-load"
        disabled>加载图数据</button>
      <div class="file-hint">默认加载项目数据（87节点/26边）</div>
    </div>

    <div class="section">
      <h3>最短路径查询</h3>
      <label>起点</label>
      <select id="sel-from"></select>
      <label style="margin-top:6px">终点</label>
      <select id="sel-to"></select>
      <label style="margin-top:6px">模式</label>
      <select id="sel-mode">
        <option value="DIST">DIST — 最短距离</option>
        <option value="TIME">TIME — 最短时间</option>
      </select>
      <div class="btn-group" style="margin-top:8px">
        <button class="btn btn-primary" onclick="findPath()">查询路径</button>
        <button class="btn btn-accent" onclick="clearPath()">清除</button>
      </div>
    </div>

    <div class="section">
      <h3>图分析</h3>
      <div class="btn-group">
        <button class="btn btn-warn btn-sm" onclick="toggleCritical()">关键节点/边</button>
        <button class="btn btn-accent btn-sm" onclick="toggleComponents()">连通分量</button>
        <button class="btn btn-sm" style="background:#607d8b;color:#fff" onclick="resetLayout()">重置视图</button>
      </div>
      <div class="info-line" style="margin-top:8px">节点数 <span id="info-nodes">—</span></div>
      <div class="info-line">边数 <span id="info-edges">—</span></div>
      <div class="info-line">连通分量 <span id="info-comp">—</span></div>
      <div class="info-line">关键节点 <span id="info-crit-nodes">—</span></div>
      <div class="info-line">关键边 <span id="info-crit-edges">—</span></div>
    </div>

    <div class="section">
      <h3>图例</h3>
      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot" style="background:#4ade80"></div> open 边
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#f87171"></div> closed 边
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#e94560"></div> 最短路径
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="border:2px solid #fbbf24;background:transparent"></div> 关键节点
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#fb923c;border-radius:0;width:14px;height:3px"></div> 关键边
        </div>
      </div>
      <div class="ring-legend">
        <div class="ring-dot"></div>
        <span style="font-size:11px;color:#94a3b8">虚线圈 = 不连通分量（同心圆排列）</span>
      </div>
    </div>

    <div class="section">
      <h3>结果</h3>
      <div id="result-box">加载后点击节点选择起终点<br>或从下拉菜单选择后点击"查询路径"<br><br>🖱 滚轮缩放 · 拖拽平移 · 点击选点</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="tooltip"></div>
  </div>

  <script>
    // ==================== 全局状态 ====================
    let places = [], roads = [];
    let placeMap = {}, adj = {};
    let layoutBounds = { minX: -900, maxX: 900, minY: -650, maxY: 650 };
    let view = { scale: 1, offsetX: 0, offsetY: 0, minScale: 0.12, maxScale: 6 };
    let layoutComponents = []; // Store components info for rendering rings
    let state = {
      fromId: null, toId: null, pathResult: null,
      showCritical: false, showComponents: false,
      critical: null, components: null, hoverNode: null,
      dragging: false, dragStartX: 0, dragStartY: 0, dragOriginX: 0, dragOriginY: 0
    };

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tooltip = document.getElementById('tooltip');

    // ==================== CSV 解析 ====================
    function parseCSV(text) {
      return text.split(/\r?\n/).filter(line => line.trim())
        .filter(line => !line.match(/^(place_id|from_id)/i))
        .map(line => line.split(',').map(p => p.trim()));
    }

    // ==================== 布局引擎 ====================
    function runLayout() {
      if (!places.length) return;

      const openAdj = {};
      places.forEach(p => { openAdj[p.id] = []; });
      roads.forEach(r => {
        if (r.status === 'open' || r.status === undefined) {
          openAdj[r.from].push(r.to); openAdj[r.to].push(r.from);
        }
      });

      // Find connected components (open edges only)
      const visited = new Set();
      const components = [];
      for (const p of places) {
        if (visited.has(p.id)) continue;
        const comp = [];
        const q = [p.id]; visited.add(p.id);
        while (q.length) {
          const u = q.shift(); comp.push(u);
          for (const v of openAdj[u]) {
            if (!visited.has(v)) { visited.add(v); q.push(v); }
          }
        }
        components.push(comp);
      }
      components.sort((a, b) => b.length - a.length);
      layoutComponents = components;

      // Main (largest) component: force-directed in center
      const mainComp = components[0] || [];
      const mainSet = new Set(mainComp);
      forceDirectedLayout(mainSet);

      // Compute main component's actual bounding radius
      let mainRadius = 300;
      if (mainComp.length) {
        let maxR2 = 0;
        for (const id of mainComp) {
          const p = placeMap[id]; if (!p) continue;
          const r2 = p.x * p.x + p.y * p.y;
          if (r2 > maxR2) maxR2 = r2;
        }
        mainRadius = Math.sqrt(maxR2);
      }

      // Disconnected components: concentric rings OUTSIDE main component
      let ringIdx = 0;
      const ringsPerLayer = 10;
      let ringBaseRadius = mainRadius + 350;
      for (let i = 1; i < components.length; i++) {
        const comp = components[i];
        const layerIdx = Math.floor(ringIdx / ringsPerLayer);
        const posInLayer = ringIdx % ringsPerLayer;
        const r = ringBaseRadius + layerIdx * 200;
        const angleStart = (posInLayer / ringsPerLayer) * Math.PI * 2 + (layerIdx * 0.25);
        layoutRing(comp, r, angleStart);
        ringIdx++;
      }
      // Mark each component's ring for rendering
      for (let i = 1; i < components.length; i++) {
        const comp = components[i];
        const ringIdx2 = i - 1;
        const layerIdx = Math.floor(ringIdx2 / ringsPerLayer);
        const r = ringBaseRadius + layerIdx * 200;
        comp._ringRadius = r;
      }

      // Compute bounds
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      places.forEach(p => {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      });
      const pad = 120;
      layoutBounds = { minX: minX - pad, maxX: maxX + pad, minY: minY - pad, maxY: maxY + pad };
    }

    function forceDirectedLayout(nodeSet) {
      const nodes = places.filter(p => nodeSet.has(p.id));
      if (nodes.length === 0) return;
      if (nodes.length === 1) { nodes[0].x = 0; nodes[0].y = 0; return; }

      // Init positions in a larger circle
      const cx = 0, cy = 0, spread = Math.min(500, nodes.length * 42);
      nodes.forEach((n, i) => {
        const angle = (i / nodes.length) * Math.PI * 2;
        n.x = cx + Math.cos(angle) * spread;
        n.y = cy + Math.sin(angle) * spread;
      });

      const area = 1000 * 750;
      const k = Math.sqrt(area / nodes.length) * 1.6;
      const iterations = 300;
      const temp0 = Math.max(300, nodes.length * 3);

      for (let iter = 0; iter < iterations; iter++) {
        const temp = temp0 * Math.pow(1 - iter / iterations, 1.5);
        const forces = nodes.map(() => ({ fx: 0, fy: 0 }));

        // Repulsive (Barnes-Hut simplified: all pairs for < 300 nodes)
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            let dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
            let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
            const fr = k * k / dist;
            forces[i].fx += (dx / dist) * fr; forces[i].fy += (dy / dist) * fr;
            forces[j].fx -= (dx / dist) * fr; forces[j].fy -= (dy / dist) * fr;
          }
        }

        // Attractive
        for (const r of roads) {
          if (!nodeSet.has(r.from) || !nodeSet.has(r.to)) continue;
          const a = placeMap[r.from], b = placeMap[r.to];
          if (!a || !b) continue;
          let dx = a.x - b.x, dy = a.y - b.y;
          let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          const fa = dist * dist / k;
          const ai = nodes.indexOf(a), bi = nodes.indexOf(b);
          if (ai >= 0) { forces[ai].fx -= (dx / dist) * fa; forces[ai].fy -= (dy / dist) * fa; }
          if (bi >= 0) { forces[bi].fx += (dx / dist) * fa; forces[bi].fy += (dy / dist) * fa; }
        }

        // Apply with temp clamping
        for (let i = 0; i < nodes.length; i++) {
          const f = forces[i];
          const mag = Math.sqrt(f.fx * f.fx + f.fy * f.fy) || 0;
          const clamp = Math.min(mag, temp) / mag;
          nodes[i].x += f.fx * clamp;
          nodes[i].y += f.fy * clamp;
        }
      }

      // Center the graph
      let sx = 0, sy = 0;
      nodes.forEach(n => { sx += n.x; sy += n.y; });
      const ox = sx / nodes.length, oy = sy / nodes.length;
      nodes.forEach(n => { n.x -= ox; n.y -= oy; });
    }

    function layoutRing(nodeIds, radius, angleStart) {
      const n = nodeIds.length;
      // For 1-2 nodes, space them out slightly
      const arcSpan = n <= 2 ? Math.PI * 0.4 : Math.PI * 1.8;
      const startAngle = n <= 2 ? angleStart - arcSpan / 2 : angleStart;
      nodeIds.forEach((id, i) => {
        const place = placeMap[id];
        if (!place) return;
        const frac = n <= 1 ? 0 : i / (n - 1);
        const angle = startAngle + frac * arcSpan;
        place.x = Math.cos(angle) * radius;
        place.y = Math.sin(angle) * radius;
      });
    }

    // ==================== 加载数据 ====================
    function loadData(placesCSV, roadsCSV) {
      const pRows = parseCSV(placesCSV);
      const rRows = parseCSV(roadsCSV);

      places = pRows.map(r => ({
        id: r[0], name: r[1], cat: r[2],
        stay: parseInt(r[3], 10) || 0, open: r[4] || '00:00', close: r[5] || '23:59',
        x: 0, y: 0
      }));

      roads = rRows.map(r => ({
        from: r[0], to: r[1],
        dist: parseInt(r[2], 10) || 0, time: parseInt(r[3], 10) || 0,
        status: r[4] || 'open'
      }));

      placeMap = {};
      places.forEach(place => { placeMap[place.id] = place; });

      adj = {};
      places.forEach(place => { adj[place.id] = []; });
      roads.forEach(road => {
        if (!adj[road.from]) adj[road.from] = [];
        if (!adj[road.to]) adj[road.to] = [];
        adj[road.from].push({ to: road.to, dist: road.dist, time: road.time, status: road.status });
        adj[road.to].push({ to: road.from, dist: road.dist, time: road.time, status: road.status });
      });

      document.getElementById('info-nodes').textContent = places.length;
      document.getElementById('info-edges').textContent = roads.length;

      const sf = document.getElementById('sel-from');
      const st = document.getElementById('sel-to');
      sf.innerHTML = ''; st.innerHTML = '';
      places.forEach(place => {
        const rd = place.name.replace(/_/g, ' ');
        const a = document.createElement('option'); a.value = place.id;
        a.textContent = `${place.id} — ${rd}`; sf.appendChild(a);
        const b = document.createElement('option'); b.value = place.id;
        b.textContent = `${place.id} — ${rd}`; st.appendChild(b);
      });

      runLayout();
      fitToView();

      state.pathResult = null; state.fromId = null; state.toId = null;
      state.showCritical = false; state.showComponents = false;
      state.critical = null; state.components = null; state.hoverNode = null;

      document.getElementById('result-box').textContent = '图数据加载完成。滚轮缩放、拖拽平移、点击节点选择起终点。';
      document.getElementById('info-crit-nodes').textContent = '—';
      document.getElementById('info-crit-edges').textContent = '—';
      document.getElementById('info-comp').textContent = '—';
      draw();
    }

    // ==================== 图算法 ====================
    function dijkstra(fromId, toId, mode) {
      const dist = {}, prev = {};
      const unvisited = new Set(places.map(p => p.id));
      dist[fromId] = 0;
      while (unvisited.size) {
        let u = null, best = Infinity;
        for (const id of unvisited) {
          if (dist[id] !== undefined && dist[id] < best) { best = dist[id]; u = id; }
        }
        if (u === null || u === toId) break;
        unvisited.delete(u);
        for (const e of adj[u]) {
          if (e.status !== 'open') continue;
          const w = mode === 'DIST' ? e.dist : e.time;
          const nd = dist[u] + w;
          if (dist[e.to] === undefined || nd < dist[e.to]) { dist[e.to] = nd; prev[e.to] = u; }
        }
      }
      if (dist[toId] === undefined) return null;
      const path = []; let cur = toId;
      while (cur !== fromId) { path.push(cur); cur = prev[cur]; }
      path.push(fromId); path.reverse();
      return { cost: dist[toId], path };
    }

    function bfs(blockedNode, blockedEdgeKey) {
      const visited = new Set(); let comps = 0;
      for (const p of places) {
        if (p.id === blockedNode || visited.has(p.id)) continue;
        comps++;
        const q = [p.id]; visited.add(p.id);
        while (q.length) {
          const u = q.shift();
          for (const e of adj[u]) {
            if (e.status !== 'open') continue;
            if (e.to === blockedNode) continue;
            const ek = u < e.to ? u + '|' + e.to : e.to + '|' + u;
            if (ek === blockedEdgeKey) continue;
            if (!visited.has(e.to)) { visited.add(e.to); q.push(e.to); }
          }
        }
      }
      return comps;
    }

    function findCritical() {
      const baseline = bfs(null, null);
      const critNodes = [], critEdges = [];
      for (const p of places) {
        if (bfs(p.id, null) > baseline) critNodes.push(p.id);
      }
      const seen = new Set();
      for (const r of roads) {
        if (r.status !== 'open') continue;
        const ek = r.from < r.to ? r.from + '|' + r.to : r.to + '|' + r.from;
        if (seen.has(ek)) continue; seen.add(ek);
        if (bfs(null, ek) > baseline) critEdges.push(r.from < r.to ? [r.from, r.to] : [r.to, r.from]);
      }
      return { nodes: critNodes.sort(), edges: critEdges };
    }

    function findComponents() {
      const visited = new Set(); const comps = [];
      for (const p of places) {
        if (visited.has(p.id)) continue;
        const comp = []; const q = [p.id]; visited.add(p.id);
        while (q.length) {
          const u = q.shift(); comp.push(u);
          for (const e of adj[u]) {
            if (e.status !== 'open') continue;
            if (!visited.has(e.to)) { visited.add(e.to); q.push(e.to); }
          }
        }
        comps.push(comp);
      }
      return comps;
    }

    // ==================== 渲染 ====================
    function resize() {
      const wrap = document.getElementById('canvas-wrap');
      const ratio = window.devicePixelRatio || 1;
      const w = Math.max(600, wrap.clientWidth), h = Math.max(400, wrap.clientHeight);
      canvas.width = Math.floor(w * ratio); canvas.height = Math.floor(h * ratio);
      canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
      fitToView(); draw();
    }
    window.addEventListener('resize', resize);

    function fitToView() {
      const w = canvas.clientWidth || 800, h = canvas.clientHeight || 600;
      const bw = layoutBounds.maxX - layoutBounds.minX || 1800;
      const bh = layoutBounds.maxY - layoutBounds.minY || 1300;
      const scale = Math.min((w - 80) / bw, (h - 80) / bh);
      view.scale = Math.max(view.minScale, Math.min(view.maxScale, scale));
      view.offsetX = (w - bw * view.scale) / 2 - layoutBounds.minX * view.scale;
      view.offsetY = (h - bh * view.scale) / 2 - layoutBounds.minY * view.scale;
    }

    function screenToWorld(cx, cy) {
      const r = canvas.getBoundingClientRect();
      return { x: (cx - r.left - view.offsetX) / view.scale, y: (cy - r.top - view.offsetY) / view.scale };
    }

    function worldToScreen(wx, wy) {
      return { x: wx * view.scale + view.offsetX, y: wy * view.scale + view.offsetY };
    }

    function nodeAt(cx, cy) {
      const w = screenToWorld(cx, cy);
      const hr = Math.max(12, 16 / view.scale), hrsq = hr * hr;
      let best = null, bestDist = hrsq;
      for (let i = 0; i < places.length; i++) {
        const dx = w.x - places[i].x, dy = w.y - places[i].y;
        const d2 = dx * dx + dy * dy;
        if (d2 <= bestDist) { bestDist = d2; best = places[i]; }
      }
      return best;
    }

    function draw() {
      const ratio = window.devicePixelRatio || 1;

      // Clear entire canvas in raw pixel space (no transform)
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!places.length) {
        ctx.fillStyle = '#94a3b8'; ctx.font = `${20 * ratio}px Microsoft YaHei`; ctx.textAlign = 'center';
        ctx.fillText('请加载 places.csv 和 roads.csv 文件', canvas.width / 2, canvas.height / 2);
        return;
      }

      // Combined transform: world coords → canvas physical pixels
      ctx.save();
      ctx.setTransform(view.scale * ratio, 0, 0, view.scale * ratio, view.offsetX * ratio, view.offsetY * ratio);

      // Background
      const bgPad = 600;
      ctx.fillStyle = '#0a0e27';
      ctx.fillRect(layoutBounds.minX - bgPad, layoutBounds.minY - bgPad,
        layoutBounds.maxX - layoutBounds.minX + bgPad * 2, layoutBounds.maxY - layoutBounds.minY + bgPad * 2);

      // Grid dots
      ctx.fillStyle = 'rgba(56,189,248,.04)';
      const gs = 100;
      for (let gx = Math.floor(layoutBounds.minX / gs) * gs; gx <= layoutBounds.maxX; gx += gs) {
        for (let gy = Math.floor(layoutBounds.minY / gs) * gs; gy <= layoutBounds.maxY; gy += gs) {
          ctx.beginPath(); ctx.arc(gx, gy, 1.5 / view.scale, 0, Math.PI * 2); ctx.fill();
        }
      }

      // Draw concentric ring guides for disconnected components
      if (layoutComponents.length > 1 && state.showComponents) {
        for (let i = 1; i < layoutComponents.length; i++) {
          const r = layoutComponents[i]._ringRadius;
          if (!r) continue;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(148,163,184,.08)';
          ctx.lineWidth = 1.5 / view.scale;
          ctx.setLineDash([6 / view.scale, 12 / view.scale]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // Path sets
      const pathEdgeSet = new Set(), pathNodeSet = new Set();
      if (state.pathResult) {
        state.pathResult.path.forEach(id => pathNodeSet.add(id));
        for (let i = 0; i + 1 < state.pathResult.path.length; i++) {
          const a = state.pathResult.path[i], b = state.pathResult.path[i + 1];
          pathEdgeSet.add(`${a}|${b}`); pathEdgeSet.add(`${b}|${a}`);
        }
      }

      const critEdgeSet = new Set();
      if (state.showCritical && state.critical) {
        state.critical.edges.forEach(([a, b]) => {
          critEdgeSet.add(`${a}|${b}`); critEdgeSet.add(`${b}|${a}`);
        });
      }

      // Component highlight hulls
      if (state.showComponents && state.components) {
        const hullColors = [
          'rgba(56,189,248,.06)', 'rgba(168,85,247,.06)', 'rgba(251,146,60,.06)',
          'rgba(244,114,182,.06)', 'rgba(52,211,153,.06)', 'rgba(250,204,21,.06)'
        ];
        state.components.forEach((comp, idx) => {
          if (comp.length < 3) return;
          const pts = comp.map(id => placeMap[id]).filter(Boolean);
          if (pts.length < 3) return;
          const hull = convexHull(pts);
          if (hull.length < 3) return;
          ctx.fillStyle = hullColors[idx % hullColors.length];
          ctx.strokeStyle = hullColors[idx % hullColors.length].replace('.06', '.18');
          ctx.lineWidth = 1.2 / view.scale;
          ctx.beginPath();
          ctx.moveTo(hull[0].x, hull[0].y);
          for (let i = 1; i < hull.length; i++) ctx.lineTo(hull[i].x, hull[i].y);
          ctx.closePath(); ctx.fill(); ctx.stroke();
        });
      }

      // Draw edges (non-path)
      const drawnEdges = new Set();
      for (const road of roads) {
        const ek = road.from < road.to ? `${road.from}|${road.to}` : `${road.to}|${road.from}`;
        if (drawnEdges.has(ek)) continue;
        drawnEdges.add(ek);
        if (pathEdgeSet.has(ek)) continue;
        const from = placeMap[road.from], to = placeMap[road.to];
        if (!from || !to) continue;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y);
        if (critEdgeSet.has(ek)) {
          ctx.strokeStyle = '#fb923c'; ctx.lineWidth = Math.max(2, 2 / view.scale);
        } else if (road.status === 'closed') {
          ctx.strokeStyle = '#f87171'; ctx.lineWidth = Math.max(1.5, 1.5 / view.scale);
          ctx.setLineDash([8 / view.scale, 5 / view.scale]);
        } else {
          ctx.strokeStyle = 'rgba(74,222,128,.3)'; ctx.lineWidth = Math.max(1, 1.5 / view.scale);
        }
        ctx.stroke(); ctx.setLineDash([]);
      }

      // Draw path edges on top
      for (const road of roads) {
        const ek = road.from < road.to ? `${road.from}|${road.to}` : `${road.to}|${road.from}`;
        if (!pathEdgeSet.has(ek)) continue;
        const from = placeMap[road.from], to = placeMap[road.to];
        if (!from || !to) continue;
        ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y);
        ctx.strokeStyle = '#e11d48'; ctx.lineWidth = Math.max(3, 4 / view.scale);
        ctx.shadowColor = '#e11d48'; ctx.shadowBlur = 12 / view.scale; ctx.stroke(); ctx.shadowBlur = 0;

        const mode = document.getElementById('sel-mode').value;
        const label = mode === 'DIST' ? `${road.dist}m` : `${road.time}min`;
        const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2;
        const ox = -(to.y - from.y) * 0.04, oy = (to.x - from.x) * 0.04;
        ctx.fillStyle = '#fbbf24';
        ctx.font = `bold ${Math.max(10, 11 / view.scale)}px monospace`;
        ctx.textAlign = 'center'; ctx.fillText(label, mx + ox, my + oy);
      }

      // Draw nodes
      const catColors = {
        Sports_and_Entertainment: '#e11d48', Teaching_Research_and_Administration: '#3b82f6',
        Dining_room: '#f97316', dormitory: '#22c55e', Medical: '#ec4899', other: '#64748b'
      };

      for (const place of places) {
        const isPath = pathNodeSet.has(place.id);
        const isCritical = state.showCritical && state.critical && state.critical.nodes.includes(place.id);
        const isSel = place.id === state.fromId || place.id === state.toId;
        const isHover = place.id === state.hoverNode;
        const radius = isHover ? 16 / view.scale : 12 / view.scale;
        const rn = place.name.replace(/_/g, ' ');

        if (isPath || isSel) {
          ctx.beginPath();
          ctx.arc(place.x, place.y, radius + 6 / view.scale, 0, Math.PI * 2);
          ctx.fillStyle = isSel ? 'rgba(225,29,72,.22)' : 'rgba(225,29,72,.1)'; ctx.fill();
        }
        if (isCritical) {
          ctx.beginPath();
          ctx.arc(place.x, place.y, radius + 5 / view.scale, 0, Math.PI * 2);
          ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = Math.max(2, 2 / view.scale);
          ctx.setLineDash([6 / view.scale, 4 / view.scale]); ctx.stroke(); ctx.setLineDash([]);
        }

        ctx.beginPath();
        ctx.arc(place.x, place.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = catColors[place.cat] || '#475569'; ctx.fill();
        ctx.strokeStyle = isSel ? '#fff' : 'rgba(30,41,59,.8)';
        ctx.lineWidth = Math.max(1.5, (isSel ? 2.6 : 1.6) / view.scale); ctx.stroke();

        ctx.fillStyle = '#f1f5f9';
        ctx.font = `bold ${Math.max(9, 10 / view.scale)}px Microsoft YaHei`;
        ctx.textAlign = 'center';
        const sl = rn.length > 10 ? rn.slice(0, 9) + '…' : rn;
        ctx.fillText(sl, place.x, place.y - radius - 5 / view.scale);

        ctx.fillStyle = '#94a3b8';
        ctx.font = `${Math.max(7, 8 / view.scale)}px monospace`;
        ctx.fillText(place.id, place.x, place.y + 3 / view.scale);
      }

      ctx.restore();
      updateTooltip();
    }

    function convexHull(points) {
      if (points.length < 3) return points;
      const pts = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
      const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
      const lo = [];
      for (const p of pts) {
        while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop();
        lo.push(p);
      }
      const up = [];
      for (let i = pts.length - 1; i >= 0; i--) {
        while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], pts[i]) <= 0) up.pop();
        up.push(pts[i]);
      }
      lo.pop(); up.pop();
      return lo.concat(up);
    }

    function updateTooltip() {
      const place = state.hoverNode ? placeMap[state.hoverNode] : null;
      if (!place) { tooltip.style.display = 'none'; return; }
      const s = worldToScreen(place.x, place.y);
      tooltip.style.display = 'block';
      tooltip.style.left = `${s.x + 14}px`; tooltip.style.top = `${s.y - 10}px`;
      tooltip.innerHTML = `<strong>${place.name.replace(/_/g, ' ')}</strong> ${place.id}<br>类别：${place.cat}<br>停留：${place.stay} 分钟`;
    }

    // ==================== 交互 ====================
    canvas.addEventListener('mousedown', e => {
      state.dragging = true;
      state.dragStartX = e.clientX; state.dragStartY = e.clientY;
      state.dragOriginX = view.offsetX; state.dragOriginY = view.offsetY;
      canvas.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', e => {
      if (state.dragging) {
        view.offsetX = state.dragOriginX + (e.clientX - state.dragStartX);
        view.offsetY = state.dragOriginY + (e.clientY - state.dragStartY);
        draw(); return;
      }
      const node = nodeAt(e.clientX, e.clientY);
      const prev = state.hoverNode;
      state.hoverNode = node ? node.id : null;
      canvas.style.cursor = node ? 'pointer' : 'grab';
      if (prev !== state.hoverNode) draw();
    });

    window.addEventListener('mouseup', e => {
      if (!state.dragging) return;
      state.dragging = false; canvas.style.cursor = 'grab';
      const moved = Math.abs(e.clientX - state.dragStartX) + Math.abs(e.clientY - state.dragStartY);
      if (moved < 4) {
        const node = nodeAt(e.clientX, e.clientY);
        if (!node) return;
        if (!state.fromId || (state.fromId && state.toId)) {
          state.fromId = node.id; state.toId = null; state.pathResult = null;
        } else {
          state.toId = node.id;
          document.getElementById('sel-from').value = state.fromId;
          document.getElementById('sel-to').value = state.toId;
          findPath(); return;
        }
        document.getElementById('sel-from').value = state.fromId;
        document.getElementById('sel-to').value = '';
        draw();
      }
    });

    canvas.addEventListener('mouseleave', () => {
      if (state.dragging) return;
      state.hoverNode = null; tooltip.style.display = 'none';
      canvas.style.cursor = 'grab'; draw();
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const bf = { x: (mx - view.offsetX) / view.scale, y: (my - view.offsetY) / view.scale };
      const zf = Math.exp(-e.deltaY * 0.0008);
      const ns = Math.max(view.minScale, Math.min(view.maxScale, view.scale * zf));
      view.offsetX = mx - bf.x * ns; view.offsetY = my - bf.y * ns;
      view.scale = ns; draw();
    }, { passive: false });

    canvas.addEventListener('dblclick', e => {
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const bf = { x: (mx - view.offsetX) / view.scale, y: (my - view.offsetY) / view.scale };
      view.scale = Math.min(view.maxScale, view.scale * 1.35);
      view.offsetX = mx - bf.x * view.scale; view.offsetY = my - bf.y * view.scale;
      draw();
    });

    // ==================== 按钮 ====================
    function findPath() {
      const fid = document.getElementById('sel-from').value;
      const tid = document.getElementById('sel-to').value;
      const mode = document.getElementById('sel-mode').value;
      if (!fid || !tid || !places.length) return;
      state.fromId = fid; state.toId = tid;
      state.pathResult = dijkstra(fid, tid, mode);
      const box = document.getElementById('result-box');
      if (!state.pathResult) {
        box.textContent = `NO_PATH — ${fid} 到 ${tid} 不可达`;
      } else {
        const cl = mode === 'DIST' ? 'm' : 'min';
        let t = `PATH ${mode} ${state.pathResult.cost} ${cl}\nNODES ${state.pathResult.path.join(' → ')}\n`;
        for (let i = 0; i + 1 < state.pathResult.path.length; i++) {
          const a = state.pathResult.path[i], b = state.pathResult.path[i + 1];
          const rd = roads.find(r => (r.from === a && r.to === b) || (r.from === b && r.to === a));
          if (rd) t += `  ${a}→${b}: ${rd.dist}m / ${rd.time}min [${rd.status}]\n`;
        }
        box.textContent = t;
      }
      draw();
    }

    function clearPath() {
      state.pathResult = null; state.fromId = null; state.toId = null;
      document.getElementById('sel-from').value = ''; document.getElementById('sel-to').value = '';
      document.getElementById('result-box').textContent = '路径已清除。'; draw();
    }

    function toggleCritical() {
      state.showCritical = !state.showCritical;
      if (state.showCritical && !state.critical && places.length) {
        state.critical = findCritical();
        document.getElementById('info-crit-nodes').textContent = state.critical.nodes.join(', ') || '无';
        document.getElementById('info-crit-edges').textContent = state.critical.edges.map(e => e.join('-')).join(', ') || '无';
      }
      if (!state.showCritical) {
        document.getElementById('info-crit-nodes').textContent = '—';
        document.getElementById('info-crit-edges').textContent = '—';
      }
      draw();
    }

    function toggleComponents() {
      state.showComponents = !state.showComponents;
      if (state.showComponents && !state.components && places.length) {
        state.components = findComponents();
        document.getElementById('info-comp').textContent = state.components.length;
      }
      if (!state.showComponents) {
        document.getElementById('info-comp').textContent = '—';
      }
      draw();
    }

    function resetLayout() {
      if (!places.length) return;
      runLayout(); fitToView(); draw();
    }

    // ==================== 文件加载 ====================
    function checkFiles() {
      document.getElementById('btn-load').disabled = !(
        document.getElementById('file-places').files[0] && document.getElementById('file-roads').files[0]

      const fr = document.getElementById('file-roads').files[0];
      if (!fp || !fr) return;
