<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>校园导航系统 — 图可视化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;background:#1a1a2e;color:#eee;display:flex;height:100vh;overflow:hidden}
#sidebar{width:320px;background:#16213e;padding:20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;border-right:2px solid #0f3460;flex-shrink:0}
#canvas-wrap{flex:1;position:relative;background:#1a1a2e}
canvas{display:block}
h2{color:#e94560;font-size:18px;border-bottom:2px solid #e94560;padding-bottom:8px}
.section{background:#0f3460;border-radius:8px;padding:14px}
.section h3{font-size:14px;color:#f0c040;margin-bottom:10px}
.btn{display:inline-block;padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;transition:.2s}
.btn-primary{background:#e94560;color:#fff}.btn-primary:hover{background:#ff6b81}
.btn-accent{background:#2196F3;color:#fff}.btn-accent:hover{background:#42a5f5}
.btn-warn{background:#f0c040;color:#1a1a2e}.btn-warn:hover{background:#f5d060}
.btn-sm{padding:3px 10px;font-size:11px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
select,input[type=file]{padding:5px 8px;border-radius:4px;border:1px solid #0f3460;background:#1a1a2e;color:#eee;font-size:12px;width:100%}
label{font-size:12px;color:#aaa;display:block;margin-bottom:2px}
.info-line{font-size:12px;color:#aaa;display:flex;justify-content:space-between}
.info-line span{color:#eee}
#result-box{font-size:11px;background:#0a1628;border-radius:4px;padding:10px;max-height:200px;overflow-y:auto;font-family:monospace;white-space:pre-wrap;color:#4caf50;line-height:1.5}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.file-hint{font-size:10px;color:#666;margin-top:2px}
</style>
</head>
<body>

<div id="sidebar">
  <h2>🏫 校园导航系统</h2>

  <div class="section">
    <h3>📂 加载数据</h3>
    <label>地点文件 (places.csv)</label>
    <input type="file" id="file-places" accept=".csv" onchange="checkFiles()">
    <label style="margin-top:6px">道路文件 (roads.csv)</label>
    <input type="file" id="file-roads" accept=".csv" onchange="checkFiles()">
    <button class="btn btn-primary btn-sm" style="margin-top:6px;width:100%" onclick="loadFiles()" id="btn-load" disabled>加载图数据</button>
    <div class="file-hint">默认加载项目数据（87节点/26边）</div>
  </div>

  <div class="section">
    <h3>🔍 最短路径查询</h3>
    <label>起点</label>
    <select id="sel-from"></select>
    <label style="margin-top:6px">终点</label>
    <select id="sel-to"></select>
    <label style="margin-top:6px">模式</label>
    <select id="sel-mode">
      <option value="DIST">DIST — 最短距离</option>
      <option value="TIME">TIME — 最短时间</option>
    </select>
    <div class="btn-group" style="margin-top:8px">
      <button class="btn btn-primary" onclick="findPath()">查询路径</button>
      <button class="btn btn-accent" onclick="clearPath()">清除</button>
    </div>
  </div>

  <div class="section">
    <h3>📊 图分析</h3>
    <div class="btn-group">
      <button class="btn btn-warn btn-sm" onclick="toggleCritical()">关键节点/边</button>
      <button class="btn btn-accent btn-sm" onclick="toggleComponents()">连通分量</button>
      <button class="btn btn-sm" style="background:#607d8b;color:#fff" onclick="resetLayout()">重新布局</button>
    </div>
    <div class="info-line" style="margin-top:8px">节点数 <span id="info-nodes">—</span></div>
    <div class="info-line">边数 <span id="info-edges">—</span></div>
    <div class="info-line">连通分量 <span id="info-comp">—</span></div>
    <div class="info-line">关键节点 <span id="info-crit-nodes">—</span></div>
    <div class="info-line">关键边 <span id="info-crit-edges">—</span></div>
  </div>

  <div class="section">
    <h3>📋 图例</h3>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#4CAF50"></div> open 边</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div> closed 边</div>
      <div class="legend-item"><div class="legend-dot" style="background:#e94560"></div> 最短路径</div>
      <div class="legend-item"><div class="legend-dot" style="border:2px solid #f0c040;background:transparent"></div> 关键节点</div>
      <div class="legend-item"><div class="legend-dot" style="background:#ff9800;border-radius:0;width:14px;height:3px"></div> 关键边</div>
    </div>
  </div>

  <div class="section">
    <h3>📝 结果</h3>
    <div id="result-box">加载数据后，点击节点选择起终点<br>或从下拉菜单选择后点击"查询路径"<br><br>操作提示：<br>• 悬停节点查看详情<br>• 点击节点选择起/终点<br>• 可拖拽节点调整位置</div>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
</div>

<script>
// ==================== 全局状态 ====================
let places = [], roads = [];
let placeMap = {}, adj = {};
let state = {
  fromId:null, toId:null, pathResult:null,
  showCritical:false, showComponents:false,
  critical:null, components:null,
  hoverNode:null
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let forceSim = null; // 力导向模拟状态

// ==================== CSV 解析 ====================
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const result = [];
  for (const line of lines) {
    if (line.match(/^(place_id|from_id)/i)) continue; // skip header
    const parts = line.split(',').map(s => s.trim());
    result.push(parts);
  }
  return result;
}

// ==================== 加载数据 ====================
function loadData(placesCSV, roadsCSV) {
  const pRows = parseCSV(placesCSV);
  const rRows = parseCSV(roadsCSV);

  places = pRows.map(r => ({
    id: r[0], name: r[1], cat: r[2], stay: parseInt(r[3])||0,
    open: r[4]||'00:00', close: r[5]||'23:59',
    x: Math.random()*600+100, y: Math.random()*400+100
  }));

  roads = rRows.map(r => ({
    from: r[0], to: r[1],
    dist: parseInt(r[2])||0, time: parseInt(r[3])||0,
    status: r[4]||'open'
  }));

  // Build lookup
  placeMap = {};
  places.forEach(p => { placeMap[p.id] = p; });

  // Build adjacency (only open edges for traversal)
  adj = {};
  places.forEach(p => { adj[p.id] = []; });
  roads.forEach(r => {
    adj[r.from].push({to:r.to, dist:r.dist, time:r.time, status:r.status});
    adj[r.to].push({to:r.from, dist:r.dist, time:r.time, status:r.status});
  });

  // Stats
  document.getElementById('info-nodes').textContent = places.length;
  document.getElementById('info-edges').textContent = roads.length;

  // Populate dropdowns
  const sf = document.getElementById('sel-from');
  const st = document.getElementById('sel-to');
  sf.innerHTML = ''; st.innerHTML = '';
  places.forEach(p => {
    const o1 = document.createElement('option'); o1.value=p.id; o1.textContent=`${p.id} — ${p.name}`; sf.appendChild(o1);
    const o2 = document.createElement('option'); o2.value=p.id; o2.textContent=`${p.id} — ${p.name}`; st.appendChild(o2);
  });

  // Run force layout
  runForceLayout();

  // Reset state
  state.pathResult = null; state.fromId = null; state.toId = null;
  state.showCritical = false; state.showComponents = false;
  state.critical = null; state.components = null;
  document.getElementById('result-box').textContent = '图数据加载完成。点击节点或从下拉菜单选择起终点查询最短路径。';
  document.getElementById('info-crit-nodes').textContent = '—';
  document.getElementById('info-crit-edges').textContent = '—';
  document.getElementById('info-comp').textContent = '—';

  resize();
  draw();
}

// ==================== 力导向布局 ====================
function runForceLayout() {
  if (places.length === 0) return;
  const W = canvas.width || 900, H = canvas.height || 650;
  const cx = W/2, cy = H/2;

  // Initialize positions in a circle
  places.forEach((p, i) => {
    const angle = (2*Math.PI*i/places.length) - Math.PI/2;
    const r = Math.min(W, H) * 0.3;
    p.x = cx + r * Math.cos(angle);
    p.y = cy + r * Math.sin(angle);
  });

  // Build edge set for fast lookup
  const edgeSet = new Set();
  roads.forEach(r => { edgeSet.add(r.from+'|'+r.to); edgeSet.add(r.to+'|'+r.from); });

  // Force simulation
  const ITER = 500;
  const repulsion = 50000;
  const attraction = 0.01;
  const damping = 0.9;

  for (let iter = 0; iter < ITER; iter++) {
    // Reset forces
    const fx = {}, fy = {};
    places.forEach(p => { fx[p.id] = 0; fy[p.id] = 0; });

    // Repulsion between all pairs
    for (let i = 0; i < places.length; i++) {
      for (let j = i+1; j < places.length; j++) {
        const a = places[i], b = places[j];
        let dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx*dx+dy*dy) || 1;
        const force = repulsion / (dist*dist);
        const fx_val = (dx/dist) * force;
        const fy_val = (dy/dist) * force;
        fx[a.id] += fx_val; fy[a.id] += fy_val;
        fx[b.id] -= fx_val; fy[b.id] -= fy_val;
      }
    }

    // Attraction along edges
    for (const r of roads) {
      const a = placeMap[r.from], b = placeMap[r.to];
      let dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.sqrt(dx*dx+dy*dy) || 1;
      const force = dist * attraction;
      const fx_val = (dx/dist) * force;
      const fy_val = (dy/dist) * force;
      fx[a.id] += fx_val; fy[a.id] += fy_val;
      fx[b.id] -= fx_val; fy[b.id] -= fy_val;
    }

    // Center gravity
    places.forEach(p => {
      fx[p.id] += (cx - p.x) * 0.001;
      fy[p.id] += (cy - p.y) * 0.001;
    });

    // Apply forces with damping
    let maxMove = 0;
    places.forEach(p => {
      const mx = fx[p.id] * damping;
      const my = fy[p.id] * damping;
      p.x += mx; p.y += my;
      p.x = Math.max(30, Math.min(W-30, p.x));
      p.y = Math.max(30, Math.min(H-30, p.y));
      maxMove = Math.max(maxMove, Math.abs(mx), Math.abs(my));
    });

    if (maxMove < 0.1) break;
  }
  draw();
}

// ==================== 图算法 ====================
function dijkstra(fromId, toId, mode) {
  const dist = {}, prev = {};
  const unvisited = new Set(places.map(p=>p.id));
  dist[fromId] = 0;
  while (unvisited.size) {
    let u = null, best = Infinity;
    for (const id of unvisited) {
      if (dist[id] !== undefined && dist[id] < best) { best = dist[id]; u = id; }
    }
    if (u === null || u === toId) break;
    unvisited.delete(u);
    for (const e of adj[u]) {
      if (e.status !== 'open') continue;
      const w = mode === 'DIST' ? e.dist : e.time;
      const nd = dist[u] + w;
      if (dist[e.to] === undefined || nd < dist[e.to]) {
        dist[e.to] = nd; prev[e.to] = u;
      }
    }
  }
  if (dist[toId] === undefined) return null;
  const path = []; let cur = toId;
  while (cur !== fromId) { path.push(cur); cur = prev[cur]; }
  path.push(fromId); path.reverse();
  return { cost:dist[toId], path };
}

function bfs(blockedNode, blockedEdgeKey) {
  const visited = new Set(); let comps = 0;
  for (const p of places) {
    if (p.id === blockedNode || visited.has(p.id)) continue;
    comps++;
    const q = [p.id]; visited.add(p.id);
    while (q.length) {
      const u = q.shift();
      for (const e of adj[u]) {
        if (e.status !== 'open') continue;
        if (e.to === blockedNode) continue;
        const ek = u < e.to ? u+'|'+e.to : e.to+'|'+u;
        if (ek === blockedEdgeKey) continue;
        if (!visited.has(e.to)) { visited.add(e.to); q.push(e.to); }
      }
    }
  }
  return comps;
}

function findCritical() {
  const baseline = bfs(null, null);
  const critNodes = [], critEdges = [];
  for (const p of places) {
    if (bfs(p.id, null) > baseline) critNodes.push(p.id);
  }
  const seen = new Set();
  for (const r of roads) {
    if (r.status !== 'open') continue;
    const ek = r.from < r.to ? r.from+'|'+r.to : r.to+'|'+r.from;
    if (seen.has(ek)) continue; seen.add(ek);
    if (bfs(null, ek) > baseline) critEdges.push(r.from < r.to ? [r.from, r.to] : [r.to, r.from]);
  }
  return { nodes:critNodes.sort(), edges:critEdges };
}

function findComponents() {
  const visited = new Set();
  const comps = [];
  for (const p of places) {
    if (visited.has(p.id)) continue;
    const comp = [];
    const q = [p.id]; visited.add(p.id);
    while (q.length) {
      const u = q.shift(); comp.push(u);
      for (const e of adj[u]) {
        if (e.status !== 'open') continue;
        if (!visited.has(e.to)) { visited.add(e.to); q.push(e.to); }
      }
    }
    comps.push(comp);
  }
  return comps;
}

// ==================== 渲染 ====================
function resize() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width = Math.max(600, wrap.clientWidth);
  canvas.height = Math.max(400, wrap.clientHeight);
  draw();
}
window.addEventListener('resize', resize);

function nodeAt(mx, my) {
  for (const p of places) {
    const dx=mx-p.x, dy=my-p.y;
    if (dx*dx+dy*dy < 400) return p;
  }
  return null;
}

function draw() {
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0, 0, W, H);

  if (places.length === 0) {
    ctx.fillStyle = '#666'; ctx.font = '20px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('请加载 places.csv 和 roads.csv 文件', W/2, H/2);
    return;
  }

  // Background grid
  ctx.strokeStyle = '#1a1a3e'; ctx.lineWidth = 1;
  for (let x=50; x<W; x+=50) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y=50; y<H; y+=50) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // Build sets for fast lookup
  const pathEdgeSet = new Set();
  const pathNodeSet = new Set();
  if (state.pathResult) {
    state.pathResult.path.forEach(id => pathNodeSet.add(id));
    for (let i=0; i+1<state.pathResult.path.length; i++) {
      const a=state.pathResult.path[i], b=state.pathResult.path[i+1];
      pathEdgeSet.add(a+'|'+b); pathEdgeSet.add(b+'|'+a);
    }
  }

  const critEdgeSet = new Set();
  if (state.showCritical && state.critical) {
    state.critical.edges.forEach(([a,b]) => { critEdgeSet.add(a+'|'+b); critEdgeSet.add(b+'|'+a); });
  }

  // Draw non-path edges
  const drawn = new Set();
  for (const r of roads) {
    const key = r.from < r.to ? r.from+'|'+r.to : r.to+'|'+r.from;
    if (drawn.has(key)) continue; drawn.add(key);
    if (pathEdgeSet.has(r.from+'|'+r.to)) continue;
    const a=placeMap[r.from], b=placeMap[r.to];
    if (!a || !b) continue;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    if (critEdgeSet.has(r.from+'|'+r.to)) {
      ctx.strokeStyle = '#ff9800'; ctx.lineWidth = 3;
    } else if (r.status === 'closed') {
      ctx.strokeStyle = '#f44336'; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
    } else {
      ctx.strokeStyle = '#2a5a3e'; ctx.lineWidth = 1.5; ctx.setLineDash([]);
    }
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Draw path edges on top
  drawn.clear();
  for (const r of roads) {
    const key = r.from < r.to ? r.from+'|'+r.to : r.to+'|'+r.from;
    if (!pathEdgeSet.has(r.from+'|'+r.to) || drawn.has(key)) continue;
    drawn.add(key);
    const a=placeMap[r.from], b=placeMap[r.to];
    if (!a || !b) continue;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = '#e94560'; ctx.lineWidth = 4;
    ctx.shadowColor = '#e94560'; ctx.shadowBlur = 10; ctx.stroke(); ctx.shadowBlur = 0;

    // Edge label
    const mode = document.getElementById('sel-mode').value;
    ctx.fillStyle = '#f0c040'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    const offX = -(b.y-a.y)*0.08, offY = (b.x-a.x)*0.08;
    ctx.fillText(mode==='DIST'?r.dist+'m':r.time+'min', mx+offX, my+offY);
  }

  // Draw components shading
  if (state.showComponents && state.components) {
    const colors = ['rgba(233,69,96,0.06)','rgba(33,150,243,0.06)','rgba(76,175,80,0.06)','rgba(240,192,64,0.06)','rgba(156,39,176,0.06)'];
    state.components.forEach((comp, i) => {
      ctx.fillStyle = colors[i%colors.length];
      comp.forEach(id => {
        const p = placeMap[id]; if(!p) return;
        ctx.beginPath(); ctx.arc(p.x, p.y, 40, 0, Math.PI*2); ctx.fill();
      });
    });
  }

  // Draw nodes
  const catColors = {'Sports_and_Entertainment':'#e94560','Teaching_Research_and_Administration':'#2196F3','Dining_room':'#ff9800',dormitory:'#4CAF50',Medical:'#e91e63',other:'#607d8b'};
  for (const p of places) {
    const isPath = pathNodeSet.has(p.id);
    const isCritical = state.showCritical && state.critical && state.critical.nodes.includes(p.id);
    const isSelected = p.id===state.fromId || p.id===state.toId;
    const isHover = p.id===state.hoverNode;
    const r = isHover ? 20 : 16;

    // Glow for path/selected
    if (isPath || isSelected) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r+6, 0, Math.PI*2);
      ctx.fillStyle = isSelected ? 'rgba(233,69,96,0.25)' : 'rgba(233,69,96,0.1)';
      ctx.fill();
    }
    // Critical ring
    if (isCritical) {
      ctx.beginPath(); ctx.arc(p.x, p.y, r+5, 0, Math.PI*2);
      ctx.strokeStyle = '#f0c040'; ctx.lineWidth = 3; ctx.setLineDash([5,3]); ctx.stroke(); ctx.setLineDash([]);
    }
    // Node body
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fillStyle = catColors[p.cat] || '#888'; ctx.fill();
    ctx.strokeStyle = isSelected?'#fff':'#1a1a2e'; ctx.lineWidth = isSelected?3:2; ctx.stroke();
    // Label
    ctx.fillStyle = '#fff'; ctx.font = (isSelected?'bold ':'')+'11px "Microsoft YaHei"'; ctx.textAlign = 'center';
    const label = p.name.length > 8 ? p.name.slice(0,7)+'…' : p.name;
    ctx.fillText(label, p.x, p.y - r - 6);
    ctx.fillStyle = '#aaa'; ctx.font = '9px monospace';
    ctx.fillText(p.id, p.x, p.y + 3);
  }
}

// ==================== 交互 ====================
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  if (state.dragNode) {
    state.dragNode.x = Math.max(30, Math.min(canvas.width-30, mx - state.dragOffX));
    state.dragNode.y = Math.max(30, Math.min(canvas.height-30, my - state.dragOffY));
    draw(); return;
  }
  const node = nodeAt(mx, my);
  const prev = state.hoverNode;
  state.hoverNode = node ? node.id : null;
  if (prev !== state.hoverNode) {
    canvas.style.cursor = node ? 'pointer' : 'default';
    draw();
  }
});
canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  const node = nodeAt(e.clientX - rect.left, e.clientY - rect.top);
  if (node) {
    state.dragNode = node;
    state.dragOffX = (e.clientX - rect.left) - node.x;
    state.dragOffY = (e.clientY - rect.top) - node.y;
    canvas.style.cursor = 'grabbing';
  }
});
canvas.addEventListener('mouseup', e => {
  if (state.dragNode) {
    const dx = Math.abs(state.dragNode.x - (state.dragNode._origX||state.dragNode.x));
    const dy = Math.abs(state.dragNode.y - (state.dragNode._origY||state.dragNode.y));
    state.dragNode._origX = state.dragNode.x;
    state.dragNode._origY = state.dragNode.y;
    state.dragNode = null;
    canvas.style.cursor = 'default';
    if (dx < 3 && dy < 3) {
      // It's a click, not a drag
      handleNodeClick(e);
    }
    return;
  }
});
function handleNodeClick(e) {
  const rect = canvas.getBoundingClientRect();
  const node = nodeAt(e.clientX - rect.left, e.clientY - rect.top);
  if (!node) return;
  if (!state.fromId || (state.fromId && state.toId)) {
    state.fromId = node.id; state.toId = null; state.pathResult = null;
  } else {
    state.toId = node.id;
    document.getElementById('sel-from').value = state.fromId;
    document.getElementById('sel-to').value = state.toId;
    findPath(); return;
  }
  document.getElementById('sel-from').value = state.fromId;
  document.getElementById('sel-to').value = '';
  draw();
}

// ==================== 按钮操作 ====================
function findPath() {
  const fromId = document.getElementById('sel-from').value;
  const toId = document.getElementById('sel-to').value;
  const mode = document.getElementById('sel-mode').value;
  if (!fromId || !toId || places.length===0) return;
  state.fromId = fromId; state.toId = toId;
  state.pathResult = dijkstra(fromId, toId, mode);
  const box = document.getElementById('result-box');
  if (!state.pathResult) {
    box.textContent = 'NO_PATH — ' + fromId + ' 到 ' + toId + ' 不可达';
  } else {
    const costLabel = mode === 'DIST' ? 'm' : 'min';
    let txt = `PATH ${mode} ${state.pathResult.cost} ${costLabel}\nNODES ${state.pathResult.path.join(' → ')}\n`;
    for (let i=0; i+1<state.pathResult.path.length; i++) {
      const a=state.pathResult.path[i], b=state.pathResult.path[i+1];
      const r = roads.find(rr=>(rr.from===a&&rr.to===b)||(rr.from===b&&rr.to===a));
      if (r) txt += `  ${a}→${b}: ${r.dist}m / ${r.time}min [${r.status}]\n`;
    }
    box.textContent = txt;
  }
  draw();
}
function clearPath() {
  state.pathResult = null; state.fromId = null; state.toId = null;
  document.getElementById('sel-from').value = ''; document.getElementById('sel-to').value = '';
  document.getElementById('result-box').textContent = '路径已清除。';
  draw();
}
function toggleCritical() {
  state.showCritical = !state.showCritical;
  if (state.showCritical && !state.critical && places.length>0) {
    state.critical = findCritical();
    document.getElementById('info-crit-nodes').textContent = state.critical.nodes.join(', ') || '无';
    document.getElementById('info-crit-edges').textContent = state.critical.edges.map(e=>e[0]+'-'+e[1]).join(', ') || '无';
  }
  if (!state.showCritical) {
    document.getElementById('info-crit-nodes').textContent = '—';
    document.getElementById('info-crit-edges').textContent = '—';
  }
  draw();
}
function toggleComponents() {
  state.showComponents = !state.showComponents;
  if (state.showComponents && !state.components && places.length>0) {
    state.components = findComponents();
    document.getElementById('info-comp').textContent = state.components.length;
  }
  if (!state.showComponents) {
    document.getElementById('info-comp').textContent = '—';
  }
  draw();
}
function resetLayout() {
  if (places.length>0) { runForceLayout(); draw(); }
}

// ==================== 文件加载 ====================
let pendingPlaces = null, pendingRoads = null;
function checkFiles() {
  const fp = document.getElementById('file-places').files[0];
  const fr = document.getElementById('file-roads').files[0];
  document.getElementById('btn-load').disabled = !(fp && fr);
}
async function loadFiles() {
  const fp = document.getElementById('file-places').files[0];
  const fr = document.getElementById('file-roads').files[0];
  if (!fp || !fr) return;
  const pt = await fp.text();
  const rt = await fr.text();
  loadData(pt, rt);
}
